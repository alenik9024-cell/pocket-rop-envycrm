<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сводка отдела продаж</title><style>body{font:14px Arial;margin:0;color:#17212b;background:#f8fafc}.box{padding:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,select{padding:9px;border:1px solid #cbd5e1;border-radius:7px;background:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card,section{background:white;border:1px solid #e2e8f0;border-radius:9px;padding:12px}.value{font-size:24px;font-weight:700;margin-top:5px}.muted{color:#64748b}.error{color:#b91c1c}</style></head><body><main class="box"><h2>Сводка отдела продаж</h2><div class="muted">Только административная учётная запись</div><div class="toolbar"><select id="period"><option value="30d">30 дней</option><option value="90d">90 дней</option><option value="quarter">Квартал</option><option value="year">Год</option></select><button id="load">Загрузить данные</button><button id="ai">Сформировать AI-выводы</button></div><div id="status" class="muted">Нажмите «Загрузить данные». AI не запускается автоматически.</div><div id="cards" class="cards"></div><section id="details" style="margin-top:12px"></section></main><script>(()=>{const q=new URLSearchParams(location.search), admin=q.get('admin_user_id'), status=document.getElementById('status'),cards=document.getElementById('cards'),details=document.getElementById('details');let data;function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){status.textContent='Загружаю сделки CRM без AI-запросов…';try{const r=await fetch('/api/pocket/deals?period='+encodeURIComponent(document.getElementById('period').value)+'&project_id=default&admin_user_id='+encodeURIComponent(admin));data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка CRM');const rows=data.items||[];const checked=rows.filter(x=>x.review);const by={};rows.forEach(x=>by[x.stage]=(by[x.stage]||0)+1);cards.innerHTML=[['Сделки',rows.length],['Уже проверены',checked.length],['Без анализа',rows.length-checked.length],['Менеджеры',(data.employees||[]).length]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('');details.innerHTML='<b>Распределение по этапам</b><ul>'+Object.entries(by).map(([k,v])=>'<li>'+esc(k)+': '+v+'</li>').join('')+'</ul>';status.textContent='Данные загружены. Стоимость AI-запросов: 0.'}catch(e){status.className='error';status.textContent=e.message}}document.getElementById('load').onclick=load;document.getElementById('ai').onclick=()=>{status.textContent='AI-сводка будет добавлена после подтверждения набора сделок; автоматический запуск отключён.'};})();</script></body></html>
