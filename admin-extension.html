<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Сводка отдела продаж</title><script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script></head><body><script>
(() => {
  const ADMIN_ID = '796108';
  const w = window.EnvyCrmWidget;
  if (!w || typeof w.init !== 'function') return;
  w.init({
    'deal-btn': function () {
      const userId = ADMIN_ID;
      const url = 'https://rop-193-124-65-29.sslip.io/admin-summary.html?admin_user_id=' + encodeURIComponent(userId);
      const content = '<iframe src="' + url + '" style="width:100%;height:calc(100vh - 70px);min-height:650px;border:0"></iframe>';
      try { if (w.openPage) return w.openPage({content}); } catch (_) {}
      if (w.openModal) return w.openModal({title:'Сводка отдела продаж', content, width:1200});
      window.open(url, '_blank', 'noopener');
    }
  });
})();
</script></body></html>
